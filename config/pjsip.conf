; A&A ISP VoIP (0115 732 3048)
[aaisp-trunk-01157323048]
type = registration
outbound_auth = aaisp-trunk-01157323048
server_uri = sip:voiceless.aa.net.uk:5060
client_uri = sip:+441157323048@voiceless.aa.net.uk
retry_interval = 60
auth_rejection_permanent = no
expiration = 3600
contact_user = incoming-01157323048

[aaisp-trunk-01157323048]
type = endpoint
context = from-aaisp
allow = all
outbound_auth = aaisp-trunk-01157323048
dtmf_mode = rfc4733
aors = aaisk-trunk-01157323048,aaisk-trunk-01157323048-a,aaisk-trunk-01157323048-b

[aaisp-trunk-01157323048]
type = identify
endpoint = aaisp-trunk-01157323048
match = voiceless.aa.net.uk

[aaisk-trunk-01157323048]
type = aor
contact = sip:+441157323048@voiceless.aa.net.uk
qualify_frequency = 20

[aaisk-trunk-01157323048-a]
type = aor
contact = sip:+441157323048@a.voiceless.aa.net.uk
qualify_frequency = 20

[aaisk-trunk-01157323048-b]
type = aor
contact = sip:+441157323048@a.voiceless.aa.net.uk
qualify_frequency = 20


