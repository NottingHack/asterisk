; Sipcord
[sipcord]
type = registration
transport = transport-udp
outbound_auth = sipcord
server_uri = sip:127.0.0.1:5066
client_uri = sip:1000@nottinghack.org.uk
retry_interval = 60
expiration = 3600

[sipcord]
type = endpoint
context = sipcord
disallow = all
allow = alaw
from_user = sipcord
from_domain = nottinghack.org.uk
outbound_auth = sipcord

[sipcord]
type = auth
auth_type = userpass
username = sipcord
password = sipcord
