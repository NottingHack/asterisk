[global]
default-realm=nottinghack.org.uk
direct_media=no

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
local_net=10.0.0.0/24
local_net=10.0.8.0/24

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0
tcp_keepalive_enable=yes
tcp_keepalive_idle_time=30
tcp_keepalive_interval_time=10
tcp_keepalive_probe_count=5
local_net=10.0.0.0/24
local_net=10.0.8.0/24

[aor-single](!)
type=aor
max_contacts=4

[acl]
type=acl
deny=0.0.0.0/0.0.0.0
permit=10.0.0.0/24  ;; vlan 2
permit=10.0.8.0/24  ;; vpn
permit=127.0.0.1/32
permit=80.235.226.218/32 ;; NATd address
permit=81.187.30.110     ;; AAISP  
permit=81.187.30.111     ;; AAISP
permit=81.187.30.112     ;; AAISP
permit=81.187.30.113     ;; AAISP
permit=81.187.30.114     ;; AAISP
permit=81.187.30.115     ;; AAISP
permit=81.187.30.116     ;; AAISP
permit=81.187.30.117     ;; AAISP
permit=81.187.30.118     ;; AAISP
permit=81.187.30.119     ;; AAISP
permit=90.155.3.0/24     ;; AAISP
permit=90.155.103.0/24   ;; AAISP
permit=92.118.29.106/32  ;; EMF

#tryinclude pjsip-auth.conf
#tryinclude pjsip-dect.conf
#tryinclude pjsip-vg224.conf
#tryinclude pjsip-hms.conf

